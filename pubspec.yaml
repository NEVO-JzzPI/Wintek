name: wintek
description: "Wintek: real-time satellite tracking on a hand-drawn 3D globe."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  http: ^1.6.0
  orbital_core:
    path: packages/orbital_core
  path_provider: ^2.1.6

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
